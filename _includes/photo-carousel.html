<!-- Photo Carousel - Auto-rotating gallery -->
<div class="photo-carousel" data-interval="{{ include.interval | default: 5000 }}">
  <div class="carousel-viewport">
    <div class="carousel-track">
      {% assign photos = include.photos %}
      {% for photo in photos %}
      <div class="carousel-slide {% if forloop.first %}active{% endif %}">
        <img src="{{ photo.src | relative_url }}" alt="{{ photo.alt | default: 'Classroom photo' }}" loading="lazy">
        {% if photo.caption %}
        <div class="carousel-caption">{{ photo.caption }}</div>
        {% endif %}
      </div>
      {% endfor %}
    </div>
  </div>

  {% if photos.size > 1 %}
  <div class="carousel-indicators">
    {% for photo in photos %}
    <button class="carousel-dot {% if forloop.first %}active{% endif %}" data-slide="{{ forloop.index0 }}" aria-label="Go to slide {{ forloop.index }}"></button>
    {% endfor %}
  </div>
  {% endif %}
</div>

<script>
(function() {
  const carousels = document.querySelectorAll('.photo-carousel');

  carousels.forEach(carousel => {
    const track = carousel.querySelector('.carousel-track');
    const slides = carousel.querySelectorAll('.carousel-slide');
    const dots = carousel.querySelectorAll('.carousel-dot');
    const interval = parseInt(carousel.dataset.interval) || 5000;

    if (slides.length <= 1) return;

    let currentIndex = 0;
    let autoPlayTimer;

    function goToSlide(index) {
      slides[currentIndex].classList.remove('active');
      dots[currentIndex]?.classList.remove('active');

      currentIndex = (index + slides.length) % slides.length;

      slides[currentIndex].classList.add('active');
      dots[currentIndex]?.classList.add('active');
    }

    function nextSlide() {
      goToSlide(currentIndex + 1);
    }

    function startAutoPlay() {
      stopAutoPlay();
      autoPlayTimer = setInterval(nextSlide, interval);
    }

    function stopAutoPlay() {
      if (autoPlayTimer) {
        clearInterval(autoPlayTimer);
      }
    }

    // Dot click handlers
    dots.forEach((dot, index) => {
      dot.addEventListener('click', () => {
        goToSlide(index);
        startAutoPlay(); // Reset timer on manual navigation
      });
    });

    // Pause on hover
    carousel.addEventListener('mouseenter', stopAutoPlay);
    carousel.addEventListener('mouseleave', startAutoPlay);

    // Start auto-play
    startAutoPlay();
  });
})();
</script>
