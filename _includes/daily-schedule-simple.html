<!-- Simple Daily Schedule Card -->
<div class="schedule-card">
  <div class="schedule-card-header">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="16" y1="2" x2="16" y2="6"></line>
      <line x1="8" y1="2" x2="8" y2="6"></line>
      <line x1="3" y1="10" x2="21" y2="10"></line>
    </svg>
    <div class="schedule-card-header-text">
      <h3>Class Schedule</h3>
      <span class="schedule-day-label" id="simple-schedule-day">Monday</span>
    </div>
    <div class="schedule-day-nav">
      <button type="button" class="schedule-day-nav-btn" id="schedule-prev-day" aria-label="Previous day">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <button type="button" class="schedule-day-nav-btn" id="schedule-next-day" aria-label="Next day">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <div class="schedule-card-body" id="simple-schedule-list">
    <!-- Populated by JavaScript -->
  </div>
</div>

<script>
(function() {
  // Use schedule data from Jekyll frontmatter if available
  {% if page.schedule %}
  const scheduleData = {
    {% for day in page.schedule %}
    "{{ day[0] }}": [
      {% for item in day[1] %}
      {
        time: "{{ item.time }}",
        activity: "{{ item.activity }}"{% if item.details %},
        details: "{{ item.details }}"{% endif %}{% if item.highlight %},
        highlight: true{% endif %}
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]{% unless forloop.last %},{% endunless %}
    {% endfor %}
  };
  {% else %}
  // Fallback schedule data
  const scheduleData = {
    monday: [
      { time: "9:00-9:30", activity: "Morning Work & Language Arts" },
      { time: "9:30-9:45", activity: "Breakfast" },
      { time: "9:45-10:00", activity: "Recess" },
      { time: "10:00-10:30", activity: "Native Language" },
      { time: "10:30-11:00", activity: "Literacy" },
      { time: "11:00-11:15", activity: "Gym" },
      { time: "11:15-11:35", activity: "Math" },
      { time: "12:00-1:00", activity: "Lunch", highlight: true },
      { time: "1:00-1:15", activity: "Symphony Math / Lexia" },
      { time: "1:15-1:45", activity: "Science" },
      { time: "2:00-2:15", activity: "Recess" },
      { time: "2:15-2:45", activity: "Music (Group)" },
      { time: "2:45-3:15", activity: "Choice Time" }
    ],
    tuesday: [
      { time: "9:00-9:30", activity: "Morning Work & Language Arts" },
      { time: "9:30-9:45", activity: "Breakfast" },
      { time: "9:45-10:30", activity: "Literacy" },
      { time: "10:30-11:00", activity: "Math" },
      { time: "11:00-11:15", activity: "Gym" },
      { time: "11:15-11:35", activity: "Math" },
      { time: "12:00-1:00", activity: "Lunch", highlight: true },
      { time: "1:00-1:15", activity: "Native Language" },
      { time: "1:15-1:45", activity: "Social Studies" },
      { time: "2:00-2:15", activity: "Recess" },
      { time: "2:15-2:45", activity: "Snack & Art" },
      { time: "2:45-3:15", activity: "Choice Time" }
    ],
    wednesday: [
      { time: "9:00-9:30", activity: "Morning Work & Language Arts" },
      { time: "9:30-9:45", activity: "Breakfast" },
      { time: "9:45-10:00", activity: "Recess" },
      { time: "10:00-10:30", activity: "Native Language" },
      { time: "10:30-11:00", activity: "Literacy" },
      { time: "11:00-11:15", activity: "Gym" },
      { time: "11:15-11:35", activity: "Math" },
      { time: "12:00-1:00", activity: "Lunch", highlight: true },
      { time: "1:00-1:15", activity: "Symphony Math / Lexia" },
      { time: "1:15-1:45", activity: "Science" },
      { time: "2:00-2:15", activity: "Recess" },
      { time: "2:15-2:45", activity: "Therapy & Music" },
      { time: "2:45-3:15", activity: "Choice Time" }
    ],
    thursday: [
      { time: "9:00-9:30", activity: "Morning Work & Language Arts" },
      { time: "9:30-9:45", activity: "Breakfast" },
      { time: "9:45-10:30", activity: "Literacy" },
      { time: "10:30-11:00", activity: "Math" },
      { time: "11:00-11:15", activity: "Gym" },
      { time: "11:15-11:35", activity: "Math" },
      { time: "12:00-1:00", activity: "Lunch", highlight: true },
      { time: "1:00-1:15", activity: "Native Language" },
      { time: "1:15-1:45", activity: "Social Studies" },
      { time: "2:00-2:15", activity: "Recess" },
      { time: "2:15-2:45", activity: "Snack & Art" },
      { time: "2:45-3:15", activity: "Choice Time" }
    ],
    friday: [
      { time: "9:00-9:30", activity: "Morning Work & Language Arts" },
      { time: "9:30-9:45", activity: "Breakfast" },
      { time: "9:45-10:00", activity: "Recess" },
      { time: "10:00-10:30", activity: "Native Language" },
      { time: "10:30-11:00", activity: "Literacy" },
      { time: "11:00-11:15", activity: "Gym" },
      { time: "11:15-11:35", activity: "Math" },
      { time: "12:00-1:00", activity: "Lunch", highlight: true },
      { time: "1:00-1:15", activity: "Symphony Math / Lexia" },
      { time: "1:15-1:45", activity: "Science" },
      { time: "2:00-2:15", activity: "Recess" },
      { time: "2:15-2:45", activity: "Snack & Art" },
      { time: "2:45-3:15", activity: "Choice Time" }
    ]
  };
  {% endif %}

  const dayOrder = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday'];
  const dayNames = { monday: 'Monday', tuesday: 'Tuesday', wednesday: 'Wednesday', thursday: 'Thursday', friday: 'Friday' };
  const jsDayKeys = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];

  const todayKey = jsDayKeys[new Date().getDay()];
  let currentIndex = dayOrder.indexOf(todayKey);
  if (currentIndex === -1) currentIndex = 0; // Weekend - default to Monday

  const dayLabel = document.getElementById('simple-schedule-day');
  const scheduleList = document.getElementById('simple-schedule-list');
  const prevBtn = document.getElementById('schedule-prev-day');
  const nextBtn = document.getElementById('schedule-next-day');

  function render() {
    if (!scheduleList) return;

    const key = dayOrder[currentIndex];
    const isToday = key === todayKey;
    dayLabel.textContent = dayNames[key] + (isToday ? ' · Today' : '');

    const daySchedule = scheduleData[key] || [];

    let html = '';
    daySchedule.forEach(item => {
      const highlightClass = item.highlight ? ' schedule-row-highlight' : '';
      const details = item.details ? `<span class="schedule-details">${item.details}</span>` : '';
      html += `<div class="schedule-row${highlightClass}">
        <span class="schedule-time">${item.time}</span>
        <span class="schedule-activity">${item.activity}${details}</span>
      </div>`;
    });

    scheduleList.innerHTML = html || '<p class="schedule-empty-msg">No schedule available.</p>';
  }

  if (prevBtn) {
    prevBtn.addEventListener('click', function() {
      currentIndex = (currentIndex - 1 + dayOrder.length) % dayOrder.length;
      render();
    });
  }

  if (nextBtn) {
    nextBtn.addEventListener('click', function() {
      currentIndex = (currentIndex + 1) % dayOrder.length;
      render();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
})();
</script>
