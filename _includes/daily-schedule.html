    <div class="daily-schedule-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <line x1="3" y1="10" x2="21" y2="10"></line>

    <div class="daily-schedule-title-wrap">
      <h3 class="daily-schedule-title">Today's Schedule</h3>

    </div>
  </div>

  <div class="daily-schedule-list" id="daily-schedule-list">

  function updateSchedule() {
    const now = new Date();
    const dayIndex = now.getDay(); // 0 = Sunday, 1 = Monday, etc.
    const days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
    const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    const dayNameEl = document.getElementById('schedule-day-name');
    const scheduleList = document.getElementById('daily-schedule-list');
    const weekendMsg = document.getElementById('schedule-weekend');

    if (!scheduleList) return;

    // Check if weekend
    if (dayIndex === 0 || dayIndex === 6) {
      dayNameEl.textContent = dayNames[dayIndex];
      scheduleList.style.display = 'none';
      weekendMsg.style.display = 'block';
      return;
    }

    // Weekday - show schedule
    const dayName = days[dayIndex];
    const todaySchedule = scheduleData[dayName];

    dayNameEl.textContent = dayNames[dayIndex];
    scheduleList.style.display = 'block';
    weekendMsg.style.display = 'none';

    // Get current time for highlighting
    const currentMinutes = now.getHours() * 60 + now.getMinutes();

    let html = '';
    todaySchedule.forEach(item => {
      // Parse time to check if current
      const timeParts = item.time.split('-');
      const startTime = timeParts[0].split(':');
      const endTime = timeParts[1].split(':');
      const startMinutes = parseInt(startTime[0]) * 60 + parseInt(startTime[1]);
      const endMinutes = parseInt(endTime[0]) * 60 + parseInt(endTime[1]);

      const isCurrent = currentMinutes >= startMinutes && currentMinutes < endMinutes;
      const isPast = currentMinutes >= endMinutes;

      let statusClass = '';
      if (isCurrent) statusClass = 'is-current';
      else if (isPast) statusClass = 'is-past';

      html += `
        <div class="schedule-item schedule-item-${item.type} ${statusClass}">
          <div class="schedule-item-icon">${getActivityIcon(item.type)}</div>
          <div class="schedule-item-content">
            <span class="schedule-item-time">${item.time}</span>
            <span class="schedule-item-activity">${item.activity}</span>
          </div>
          ${isCurrent ? '<span class="schedule-item-now">Now</span>' : ''}
        </div>
      `;
    });

    scheduleList.innerHTML = html;
  }

  // Run on load
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', updateSchedule);
  } else {
    updateSchedule();
  }

  // Update every minute to keep "current" highlighting accurate
  setInterval(updateSchedule, 60000);
})();
