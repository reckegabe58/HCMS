# Henry Coaster Memorial School - Jekyll Configuration
# Marten Falls First Nation, Ontario

# Site settings
title: Henry Coaster Memorial School
tagline: Where our students walk in the footsteps of their ancestors to achieve their dreams.
email: tom.recke@martenfalls.com
description: >-
  Henry Coaster Memorial School serves the Marten Falls First Nation community,
  providing K-8 education rooted in Oji-Cree culture and dedicated to land-based learning.

# Custom domain configuration
baseurl: ""
url: "https://henrycoastermemorialschool.ca"

# Location information
location:
  community: Marten Falls First Nation
  physical_address: Henry Coaster Memorial School, Ogoki Post, Ontario P0T 2L0
  mailing_address: Henry Coaster Memorial School, Ogoki Post, Ontario P0T 2L0
  phone: (807) 349-2532

# School information
school:
  established: 1985
  grades: K-8
  students: 60
  staff: 25

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Collections
collections:
  classrooms:
    output: true
    permalink: /classrooms/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Administration"
  - scope:
      path: ""
      type: "classrooms"
    values:
      layout: "classroom"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - DEPLOYMENT-INSTRUCTIONS.md
