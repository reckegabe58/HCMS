# Henry Coaster Memorial School - Jekyll Configuration
# Marten Falls First Nation, Ontario

# Site settings
title: Henry Coaster Memorial School
tagline: Where our students walk in the footsteps of their ancestors to achieve their dreams.
email: info@henrycoastermemorialschool.com
description: >-
  Henry Coaster Memorial School serves the Marten Falls First Nation community,
  providing K-8 education rooted in Oji-Cree culture and dedicated to land-based learning.

# CRITICAL: This must match your GitHub repository name exactly
baseurl: "/HCMS"
url: "https://reckegabe58.github.io"

# Location information
location:
  community: Marten Falls First Nation
  physical_address: 123 School Road, Ogoki Post, ON
  mailing_address: PO Box 10, Marten Falls First Nation, ON P0T 2L0
  phone: (807) 349-2532
  fax: (807) 349-2533
  office_hours: Monday - Friday, 8:30 AM - 4:00 PM

# Social media
social:
  facebook: "#"
  youtube: "#"
  instagram: "#"

# School information
school:
  established: 1985
  grades: K-8
  students: 85
  staff: 25

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Collections
collections:
  classrooms:
    output: true
    permalink: /classrooms/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Administration"
  - scope:
      path: ""
      type: "classrooms"
    values:
      layout: "classroom"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - DEPLOYMENT-INSTRUCTIONS.md
